[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "docconv"
version = "0.1.0"
description = "Convert documents (PDF, DOCX, PPTX, XLSX, HTML, EPUB, images) to Markdown — local, offline-first."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["markdown", "converter", "pdf", "docx", "ocr", "cli"]
dependencies = [
    "typer[all]>=0.12",
    "rich>=13",
    "pydantic>=2",
    "pyyaml>=6",
    "pymupdf4llm>=0.0.17",
    "PyMuPDF>=1.24",
    "python-docx>=1.1",
    "python-pptx>=0.6",
    "openpyxl>=3.1",
    "beautifulsoup4>=4.12",
    "lxml>=5",
    "markdownify>=0.13",
    "ebooklib>=0.18",
    "Pillow>=10",
    "pytesseract>=0.3",
    "python-frontmatter>=1.1",
    "streamlit>=1.35",
]

[project.optional-dependencies]
ocr = ["ocrmypdf>=16"]
docling = ["docling>=2"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "reportlab>=4",
]

[project.scripts]
docconv = "docconv.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/docconv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src/docconv"]
